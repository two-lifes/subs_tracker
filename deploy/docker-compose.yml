# Production compose: copied to the server by CI, runs the image built and tested in CI.
# Secrets live only in the server's .env next to this file.
services:
  bot:
    image: ghcr.io/two-lifes/subs_tracker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_PATH: /data/subs.db
      # Set by deploy.sh on rollback so the bot can report the failed version
      FAILED_VERSION: ${FAILED_VERSION:-}
      # Reachable only from containers on the bots_internal network; no port is published to the host
      API_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    networks:
      default:
      bots_internal:
        aliases: [subs-api]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  bots_internal:
    # Shared with the finance bot; deploy.sh creates it if missing
    external: true
